<!DOCTYPE html>
<html lang="en" data-theme="strawberry">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LumiDesk</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <nav class="sidebar">
            <h1 class="logo">LumiDesk</h1>
            <ul>
                <li class="active">Home</li>
                <li>Focus</li>
                <li>Tasks</li>
                <li>Notes</li>
                <li>Subjects</li>
            </ul>
            <div class="bottom-nav">
                <li id="theme-toggle">Theme</li>
                <li>Settings</li>
            </div>
        </nav>

        <main class="dashboard">
            <header>
                <h2 id="greeting">Good afternoon, Dhritideep!</h2>
            </header>
            
            <div class="grid-container">
                <div class="card pomodoro-card">
                    <div class="timer-display" id="time">25:00</div>
                    <div class="plant-status" id="plant">🌱</div>
                    <p class="mode-text">FOCUS</p>
                    <button id="start-timer" class="btn">START</button>
                </div>

                <div class="card tasks-card">
                    <h3>TODAY</h3>
                    <div class="task-input-area">
                        <input type="text" id="new-task" placeholder="Add a new task...">
                        <button id="add-task-btn" class="btn-small">+</button>
                    </div>
                    <ul class="task-list" id="task-list">
                    </ul>
                </div>

                <div class="card notes-card">
                    <h3>Quick Notes</h3>
                    <div class="note-controls">
                        <button id="add-note-btn" class="btn-small">+ New Note</button>
                    </div>
                    <div class="notes-grid" id="notes-grid">
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
