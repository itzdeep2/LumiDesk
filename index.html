<!DOCTYPE html>
<html lang="en" data-theme="strawberry">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LumiDesk 🌈</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <h1 class="logo">🌈 LumiDesk</h1>
            <ul>
                <li class="active">⌂ Home</li>
                <li>⏱ Focus</li>
                <li>✅ Tasks</li>
                <li>📝 Notes</li>
                <li>📚 Subjects</li>
            </ul>
            <div class="bottom-nav">
                <li id="theme-toggle">🎨 Theme</li>
                <li>⚙ Settings</li>
            </div>
        </nav>

        <!-- Main Workspace -->
        <main class="dashboard">
            <header>
                <h2 id="greeting">☀️ Good afternoon, Dhritideep!</h2>
            </header>
            
            <div class="grid-container">
                <!-- Pomodoro Widget -->
                <div class="card pomodoro-card">
                    <div class="timer-display" id="time">25:00</div>
                    <div class="plant-status" id="plant">🌱</div>
                    <p class="mode-text">FOCUS</p>
                    <button id="start-timer" class="btn">START</button>
                </div>

                <!-- Quick Tasks Placeholder -->
                <div class="card tasks-card">
                    <h3>✅ TODAY</h3>
                    <ul class="task-list">
                        <li><input type="checkbox"> Finish integration exercise</li>
                        <li><input type="checkbox"> Physics notes</li>
                    </ul>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
